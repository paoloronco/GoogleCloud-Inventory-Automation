name: Python tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m compileall -q cloudrun
      - name: Unit tests
        run: PYTHONPATH=cloudrun python -m unittest discover -s cloudrun -p 'test_*.py' -v
